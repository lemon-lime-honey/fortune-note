[package]
name = "fortune-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[dependencies]
vedaksha = "9.4.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
utz = { version = "0.4.1", features = ["balanced", "std"] }
chrono-tz = "0.10.4"

[dev-dependencies]
approx = "0.5"
